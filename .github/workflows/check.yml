name: check

on:
  push:
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: No fail.txt
        run: |
          if [ -f fail.txt ]; then
            echo "fail.txt is forbidden in this repository: remove it"
            exit 1
          fi
          echo "ok"
